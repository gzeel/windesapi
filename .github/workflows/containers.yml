name: Test and publish containers

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: false

env:
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/windesapi-api-lab
  CLIENT_IMAGE: ghcr.io/${{ github.repository_owner }}/windesapi-api-client

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Validate Compose configurations
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.dev.yaml config --quiet
          docker compose -f compose.test.yaml config --quiet

      - name: Build and run automated tests
        run: |
          docker compose -f compose.test.yaml build test
          docker compose -f compose.test.yaml run --rm test

      - name: Build runtime images
        run: docker compose -f compose.yaml -f compose.dev.yaml build api client

      - name: Run standalone container smoke test
        env:
          SKIP_PULL: "1"
          API_IMAGE: windesapi-api-lab:dev
          CLIENT_IMAGE: windesapi-api-client:dev
        run: sh tests/standalone-smoke.sh

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-lab
            image: windesapi-api-lab
            dockerfile: Dockerfile
            target: runtime
          - name: api-client
            image: windesapi-api-client
            dockerfile: client/Dockerfile
            target: runtime
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate OCI metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=WindesAPI ${{ matrix.name }}
            org.opencontainers.image.description=Lokaal API-onderwijslab; geen productievoorbeeld
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  promote-latest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote tested images to latest
        run: |
          docker buildx imagetools create --tag "$API_IMAGE:latest" "$API_IMAGE:sha-${GITHUB_SHA}"
          docker buildx imagetools create --tag "$CLIENT_IMAGE:latest" "$CLIENT_IMAGE:sha-${GITHUB_SHA}"

  verify-public:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: promote-latest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Confirm public pulls without login
        run: |
          docker logout ghcr.io || true
          docker pull "$API_IMAGE:latest"
          docker pull "$CLIENT_IMAGE:latest"

      - name: Smoke test ARM64 images under QEMU
        run: |
          docker network create windesapi-arm64
          trap 'docker rm -f windesapi-api-arm64 >/dev/null 2>&1 || true; docker network rm windesapi-arm64 >/dev/null 2>&1 || true' EXIT
          docker run -d --platform linux/arm64 --network windesapi-arm64 --name windesapi-api-arm64 "$API_IMAGE:latest"
          for attempt in $(seq 1 30); do
            echo "ARM64 healthcheck poging $attempt"
            if docker run --rm --platform linux/arm64 --network windesapi-arm64 "$CLIENT_IMAGE:latest" \
              curl --fail --silent --show-error http://windesapi-api-arm64:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs windesapi-api-arm64
          exit 1

      - name: Run standalone test with published images
        env:
          API_IMAGE: ghcr.io/${{ github.repository_owner }}/windesapi-api-lab:latest
          CLIENT_IMAGE: ghcr.io/${{ github.repository_owner }}/windesapi-api-client:latest
        run: sh tests/standalone-smoke.sh
